<!doctype html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>ĐI CHÙA ONLINE 3D</title>
<style>
*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#b8d9df;font-family:system-ui,Arial;color:#fff}
#game{position:fixed;inset:0}canvas{display:block}
#top{position:fixed;top:12px;left:12px;right:12px;display:flex;justify-content:space-between;gap:8px;pointer-events:none}
.panel{background:#14251dcc;border:1px solid #ffffff33;border-radius:14px;padding:9px 12px;backdrop-filter:blur(8px);box-shadow:0 4px 18px #0003}
#title{font-weight:900;letter-spacing:1px;font-size:14px}#hint{font-size:11px;opacity:.85;margin-top:2px}
#stats{font-size:12px;text-align:right;line-height:1.6}
#toast{position:fixed;left:50%;top:88px;transform:translateX(-50%);background:#172c24e8;border:1px solid #ffffff44;border-radius:20px;padding:9px 15px;font-size:13px;opacity:0;transition:opacity .25s;pointer-events:none;white-space:nowrap}
#bottom{position:fixed;bottom:18px;left:18px;right:18px;display:flex;justify-content:space-between;align-items:end;pointer-events:none}
#pad{display:grid;grid-template-columns:48px 48px 48px;grid-template-rows:48px 48px 48px;gap:5px;pointer-events:auto}
.ctrl{border:1px solid #ffffff66;background:#172c24bb;color:white;border-radius:13px;font-size:20px;touch-action:none;user-select:none}
#up{grid-column:2}#left{grid-column:1;grid-row:2}#down{grid-column:2;grid-row:2}#right{grid-column:3;grid-row:2}
#actions{display:flex;gap:9px;pointer-events:auto}.action{border:1px solid #ffffff66;background:#8a5b2dcc;color:#fff;border-radius:50%;width:62px;height:62px;font-weight:700;font-size:12px;touch-action:none}
#help{position:fixed;bottom:12px;left:50%;transform:translateX(-50%);font-size:10px;color:#fff;text-shadow:0 1px 3px #000;opacity:.8;white-space:nowrap;pointer-events:none}
@media(min-width:800px){#pad{opacity:.65}.action{width:70px;height:70px}#help{font-size:12px}}

#characterBtn{position:fixed;right:12px;top:94px;background:#5b4933dd;color:white;border:1px solid #ffffff66;border-radius:12px;padding:9px 12px;font-weight:700;z-index:5}
#customizer{display:none;position:fixed;inset:0;background:#08130dcc;z-index:10;align-items:center;justify-content:center;padding:18px}
#customizer.show{display:flex}
#customCard{width:min(360px,100%);background:#f4ead5;color:#382d22;border-radius:20px;padding:18px;box-shadow:0 12px 40px #0008}
#customCard h2{margin:0 0 12px;font-size:20px}
#customCard label{display:block;font-size:13px;font-weight:700;margin:10px 0 5px}
#customCard select,#customCard input{width:100%;padding:11px;border-radius:10px;border:1px solid #c8b99d;background:#fff;font-size:15px}
#customCard button{padding:11px 14px;border:0;border-radius:11px;background:#76502e;color:#fff;font-weight:700;margin-top:12px}
#extraActions{display:flex;gap:7px;pointer-events:auto;flex-wrap:wrap;justify-content:flex-end;max-width:220px}
.extra{border:1px solid #ffffff66;background:#31594ddd;color:#fff;border-radius:13px;padding:10px 12px;font-size:11px;font-weight:700;touch-action:manipulation}
@media(max-width:600px){#bottom{bottom:12px}#extraActions{max-width:145px}.extra{padding:8px 9px;font-size:10px}}
</style>
</head>
<body>
<div id="game"></div>
<div id="top">
 <div class="panel"><div id="title">🪷 ĐI CHÙA ONLINE 3D</div><div id="hint">Tự do khám phá • Bản đồ thanh tịnh</div></div>
 <div class="panel" id="stats"><span id="onlineStatus">⚪ Đang kết nối...</span><br>🌸 Hoa sen: <b id="flowers">0</b><br>📍 <span id="place">Cổng Tam Quan</span></div>
</div>
<div id="toast"></div>
<button id="characterBtn">👤 Nhân vật</button>
<div id="customizer">
 <div id="customCard">
  <h2>👘 Chọn nhân vật</h2>
  <label for="playerName">Tên hiển thị</label><input id="playerName" maxlength="16" placeholder="Tên của bạn">
  <label for="gender">Nhân vật</label><select id="gender"><option value="female">Nữ</option><option value="male">Nam</option></select>
  <label for="outfit">Trang phục</label><select id="outfit"><option value="ceremony">Áo lễ Phật (mặc định)</option><option value="lam">Áo lam đi chùa</option><option value="brown">Áo nâu giản dị</option><option value="gold">Áo vàng trang nghiêm</option></select>
  <div style="display:flex;gap:8px"><button id="applyCharacter">Lưu nhân vật</button><button id="closeCharacter" style="background:#777">Đóng</button></div>
 </div>
</div>
<div id="bottom">
 <div id="pad">
  <button class="ctrl" id="up">▲</button><button class="ctrl" id="left">◀</button><button class="ctrl" id="down">▼</button><button class="ctrl" id="right">▶</button>
 </div>
 <div id="actions"><button class="action" id="pray">🙏<br>Lễ Phật</button><button class="action" id="collect">🪷<br>Nhặt sen</button><div id="extraActions"><button class="extra" id="offer">💐 Dâng hoa</button><button class="extra" id="bow100">🙇 Vái 100 lần</button><button class="extra" id="squat">🧎 Ngồi xổm</button></div></div>
</div>
<div id="help">Máy tính: WASD / phím mũi tên • Điện thoại: dùng nút điều khiển</div>
<script src="https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.min.js"></script>
<script>
(()=>{
const root=document.getElementById('game');
if(!window.THREE){root.innerHTML='<div style="padding:30px;color:#173">Không tải được thư viện 3D. Hãy kết nối Internet rồi tải lại trang.</div>';return;}
const scene=new THREE.Scene();scene.background=new THREE.Color(0x9bcbd0);scene.fog=new THREE.Fog(0x9bcbd0,45,145);
const camera=new THREE.PerspectiveCamera(62,innerWidth/innerHeight,.1,250);
const renderer=new THREE.WebGLRenderer({antialias:true});renderer.setSize(innerWidth,innerHeight);renderer.setPixelRatio(Math.min(devicePixelRatio,1.8));renderer.shadowMap.enabled=true;renderer.shadowMap.type=THREE.PCFSoftShadowMap;root.appendChild(renderer.domElement);
scene.add(new THREE.HemisphereLight(0xe8f7ff,0x65764a,2.0));
const sun=new THREE.DirectionalLight(0xffedc5,2.4);sun.position.set(-35,55,25);sun.castShadow=true;sun.shadow.mapSize.set(2048,2048);sun.shadow.camera.left=-65;sun.shadow.camera.right=65;sun.shadow.camera.top=65;sun.shadow.camera.bottom=-65;scene.add(sun);
const mat=(color,rough=.85)=>new THREE.MeshStandardMaterial({color,roughness:rough});
const grass=mat(0x6e9b60),stone=mat(0xaaa99a),dark=mat(0x51463d),red=mat(0x8d3429),gold=mat(0xd6a94f),cream=mat(0xe8d9b9),water= new THREE.MeshStandardMaterial({color:0x4c9da5,roughness:.22,metalness:.12}),leaf=mat(0x3d7147),trunk=mat(0x6d4930);
function box(w,h,d,m,x,y,z){let o=new THREE.Mesh(new THREE.BoxGeometry(w,h,d),m);o.position.set(x,y,z);o.castShadow=true;o.receiveShadow=true;scene.add(o);return o}
function cyl(rt,rb,h,m,x,y,z,n=12){let o=new THREE.Mesh(new THREE.CylinderGeometry(rt,rb,h,n),m);o.position.set(x,y,z);o.castShadow=true;scene.add(o);return o}
function roof(w,d,x,y,z){let g=new THREE.Group();let base=new THREE.Mesh(new THREE.BoxGeometry(w,.24,d),red);base.position.y=0;g.add(base);let r=new THREE.Mesh(new THREE.ConeGeometry(w*.72,.75,4),red);r.rotation.y=Math.PI/4;r.scale.z=d/w;r.position.y=.42;g.add(r);let ridge=new THREE.Mesh(new THREE.BoxGeometry(w*.92,.12,.18),gold);ridge.position.y=.78;g.add(ridge);g.position.set(x,y,z);g.traverse(o=>{if(o.isMesh){o.castShadow=true;o.receiveShadow=true}});scene.add(g);return g}
function tree(x,z,s=1){cyl(.22*s,.34*s,2.2*s,trunk,x,1.1*s,z);for(let i=0;i<3;i++){let q=new THREE.Mesh(new THREE.SphereGeometry(1,10,8),leaf);q.scale.set(1.25*s,.8*s,1.15*s);q.position.set(x,(2.1+i*.45)*s,z);q.castShadow=true;scene.add(q)}}
function lantern(x,z){cyl(.10,.13,1.15,dark,x,.58,z);box(.62,.12,.62,gold,x,1.2,z);let l=box(.48,.62,.48,red,x,1.55,z);l.material=red;box(.66,.1,.66,dark,x,1.9,z);cyl(.04,.04,.3,gold,x,2.1,z)}
// terrain
let ground=new THREE.Mesh(new THREE.PlaneGeometry(180,180),grass);ground.rotation.x=-Math.PI/2;ground.receiveShadow=true;scene.add(ground);
// main stone walkway and courtyard
box(9,.12,62,stone,0,.04,0);box(38,.13,24,stone,0,.05,-19);
for(let x=-17;x<=17;x+=4)for(let z=-28;z<=-10;z+=4)box(.12,.025,.12,gold,x,.13,z);
// entrance gate
for(let x of [-4.4,4.4]){box(.75,5,.8,red,x,2.5,-27);cyl(.42,.42,.3,gold,x,4.8,-27)}
box(10,.5,1.1,dark,0,5.1,-27);roof(12,3,0,5.45,-27);
// temple courtyard main hall
for(let x of [-7,7]){box(.8,6,.8,red,x,3,-2);box(1.05,.2,1.05,gold,x,5.8,-2)}
box(17,.6,10,cream,0,3,-2);box(18,.4,11,red,0,6.1,-2);roof(20,13,0,6.35,-2);
for(let x=-6;x<=6;x+=4){box(.3,3,.3,gold,x,1.5,-7)}
// altar and statue silhouette
box(4,.65,2,gold,0,.45,-1);cyl(.8,.9,1.5,gold,0,1.5,-2,20);let head=new THREE.Mesh(new THREE.SphereGeometry(.62,20,16),gold);head.position.set(0,2.65,-2);head.castShadow=true;scene.add(head);
for(let x of [-5,5])lantern(x,-12);
for(let x=-8;x<=8;x+=4)lantern(x,-25);
// pagoda side pavilion
box(7,.3,7,cream,17,.15,-5);for(let x of [14,20])for(let z of [-8,-2])box(.35,3,.35,red,x,1.6,z);roof(9,9,17,3.1,-5);roof(7,7,17,4,-5);
// pond
let pond=new THREE.Mesh(new THREE.CylinderGeometry(8,8,.22,48),water);pond.rotation.x=0;pond.scale.z=.72;pond.position.set(-20,.04,-12);scene.add(pond);
for(let i=0;i<13;i++){let a=i*2.4;let x=-20+Math.cos(a)*(3+(i%3)*1.1),z=-12+Math.sin(a)*(2+(i%3));let f=new THREE.Mesh(new THREE.CircleGeometry(.48,12),mat(0x4e9c65));f.rotation.x=-Math.PI/2;f.position.set(x,.19,z);scene.add(f);let b=new THREE.Mesh(new THREE.SphereGeometry(.18,10,8),mat(0xe8a5b8));b.scale.set(1,.45,1);b.position.set(x,.32,z);scene.add(b)}
// garden, trees and stepping stones
for(let i=0;i<42;i++){let x=(Math.sin(i*12.4)*.5+.5)*100-50,z=(Math.cos(i*7.7)*.5+.5)*100-50;if(Math.abs(x)<12&&z>-33&&z<5)continue;if(Math.hypot((x+20),((z+12)*1.35))<9)continue;tree(x,z,.65+(i%4)*.13)}
for(let i=0;i<18;i++){let x=(Math.sin(i*8)*.5+.5)*60-30,z=(Math.cos(i*3.2)*.5+.5)*55-35; if(Math.abs(x)<8&&z>-30&&z<3)continue;lantern(x,z)}
// player
const player=new THREE.Group();scene.add(player);
let body=new THREE.Mesh(new THREE.CapsuleGeometry(.42,.85,5,10),mat(0x315d78));body.position.y=1.05;body.castShadow=true;player.add(body);
let face=new THREE.Mesh(new THREE.SphereGeometry(.34,16,12),mat(0xe7b98e));face.position.y=1.85;face.castShadow=true;player.add(face);
let hair=new THREE.Mesh(new THREE.SphereGeometry(.35,16,10,0,Math.PI*2,0,Math.PI*.55),mat(0x30251e));hair.position.y=2.02;player.add(hair);
let foot1=box(.28,.18,.48,mat(0x342d2a),-.22,.13,0),foot2=box(.28,.18,.48,mat(0x342d2a),.22,.13,0);player.add(foot1,foot2);

player.position.set(0,0,14);
let avatarGender='female', avatarOutfit='ceremony', playerDisplayName='Khách chùa';
let bowRemaining=0, bowClock=0, squatMode=false;
const outfitColors={ceremony:0xb85c32,lam:0x527c91,brown:0x76533c,gold:0xd3a64c};
function applyAvatar(){
 body.material.color.setHex(outfitColors[avatarOutfit]||outfitColors.ceremony);
 hair.scale.set(avatarGender==='female'?1.12:1,avatarGender==='female'?1.12:1,avatarGender==='female'?1.12:1);
 face.material.color.setHex(avatarGender==='female'?0xf0c6a4:0xe7b98e);
 document.getElementById('hint').textContent=(avatarGender==='female'?'Nữ':'Nam')+' • '+({ceremony:'Áo lễ Phật',lam:'Áo lam',brown:'Áo nâu',gold:'Áo vàng'}[avatarOutfit])+' • Tự do khám phá';
}
document.getElementById('characterBtn').onclick=()=>{document.getElementById('customizer').classList.add('show');document.getElementById('playerName').value=playerDisplayName;document.getElementById('gender').value=avatarGender;document.getElementById('outfit').value=avatarOutfit};
document.getElementById('closeCharacter').onclick=()=>document.getElementById('customizer').classList.remove('show');
document.getElementById('applyCharacter').onclick=()=>{
 playerDisplayName=(document.getElementById('playerName').value.trim()||'Khách chùa').slice(0,16);
 avatarGender=document.getElementById('gender').value;avatarOutfit=document.getElementById('outfit').value;applyAvatar();
 document.getElementById('customizer').classList.remove('show');toast('Đã cập nhật nhân vật của bạn!');
 if(socket&&socket.readyState===WebSocket.OPEN)socket.send(JSON.stringify({type:'profile',name:playerDisplayName,gender:avatarGender,outfit:avatarOutfit}));
};
applyAvatar();

// MULTIPLAYER: mọi kết nối dùng chung một phòng toàn cầu trên cùng máy chủ
const remotePlayers = new Map();
let socket = null, myId = null, lastNetSend = 0;
const statusEl = document.getElementById('onlineStatus');
function makeRemote(id, name, x, z, gender='female', outfit='ceremony') {
  const g = new THREE.Group();
  const outfitPalette={ceremony:0xb85c32,lam:0x527c91,brown:0x76533c,gold:0xd3a64c};\n  const b = new THREE.Mesh(new THREE.CapsuleGeometry(.42,.85,5,10), mat(outfitPalette[outfit]||outfitPalette.ceremony));
  b.position.y=1.05; b.castShadow=true; g.add(b);
  const h = new THREE.Mesh(new THREE.SphereGeometry(.34,16,12), mat(gender==='female'?0xf0c6a4:0xe7b98e));
  h.position.y=1.85; h.castShadow=true; g.add(h);
  const hair2 = new THREE.Mesh(new THREE.SphereGeometry(.35,16,10,0,Math.PI*2,0,Math.PI*.55), mat(0x30251e));
  hair2.position.y=2.02; if(gender==='female')hair2.scale.set(1.12,1.12,1.12); g.add(hair2);
  g.position.set(x,0,z); scene.add(g);
  const tagCanvas=document.createElement('canvas'); tagCanvas.width=256; tagCanvas.height=64;
  const ctx=tagCanvas.getContext('2d'); ctx.fillStyle='rgba(20,35,28,.8)';
  ctx.beginPath(); ctx.roundRect(5,5,246,54,16); ctx.fill();
  ctx.fillStyle='white'; ctx.font='bold 25px Arial'; ctx.textAlign='center';
  ctx.fillText(String(name||'Khách chùa').slice(0,16),128,40);
  const tex=new THREE.CanvasTexture(tagCanvas);
  const sprite=new THREE.Sprite(new THREE.SpriteMaterial({map:tex,transparent:true}));
  sprite.scale.set(3.1,.78,1); sprite.position.y=2.8; g.add(sprite);
  remotePlayers.set(id,{group:g,target:new THREE.Vector3(x,0,z),name});
}
function connectMultiplayer(){
  const proto=location.protocol==='https:'?'wss://':'ws://';
  const url=window.GAME_SERVER_URL || (proto+location.host);
  try {
    socket=new WebSocket(url);
    socket.onopen=()=>{
      statusEl.textContent='🟢 Đang online';
      socket.send(JSON.stringify({type:'join',name:playerDisplayName,gender:avatarGender,outfit:avatarOutfit,x:player.position.x,z:player.position.z,rot:player.rotation.y}));
    };
    socket.onmessage=(ev)=>{
      let m; try{m=JSON.parse(ev.data)}catch{return}
      if(m.type==='welcome'){myId=m.id; (m.players||[]).forEach(p=>{if(p.id!==myId)makeRemote(p.id,p.name,p.x,p.z,p.gender,p.outfit)});}
      if(m.type==='join' && m.player && m.player.id!==myId){
        if(!remotePlayers.has(m.player.id))makeRemote(m.player.id,m.player.name,m.player.x,m.player.z,m.player.gender,m.player.outfit);
      }
      if(m.type==='move' && m.player && m.player.id!==myId){
        let p=remotePlayers.get(m.player.id);
        if(!p)makeRemote(m.player.id,m.player.name,m.player.x,m.player.z,m.player.gender,m.player.outfit);
        p=remotePlayers.get(m.player.id);
        p.target.set(m.player.x,0,m.player.z);
        p.group.rotation.y=m.player.rot||0;
      }
      if(m.type==='profile' && m.player && m.player.id!==myId){
        const old=remotePlayers.get(m.player.id);
        if(old){scene.remove(old.group);remotePlayers.delete(m.player.id);}
        makeRemote(m.player.id,m.player.name,m.player.x,m.player.z,m.player.gender,m.player.outfit);
      }
      if(m.type==='leave'){
        const p=remotePlayers.get(m.id); if(p){scene.remove(p.group);remotePlayers.delete(m.id);}
      }
      if(m.type==='count' && typeof m.count==='number') statusEl.textContent='🟢 Online: '+m.count;
    };
    socket.onclose=()=>{statusEl.textContent='🟠 Mất kết nối • Đang thử lại';setTimeout(connectMultiplayer,3000)};
    socket.onerror=()=>{statusEl.textContent='🟠 Chưa kết nối máy chủ';};
  } catch(e){statusEl.textContent='🟠 Chưa kết nối máy chủ';}
}
connectMultiplayer();

const keys={};let flowers=0;const petals=[];
function makeFlower(x,z){let g=new THREE.Group();let center=new THREE.Mesh(new THREE.SphereGeometry(.16,12,10),gold);center.position.y=.3;g.add(center);for(let j=0;j<6;j++){let p=new THREE.Mesh(new THREE.SphereGeometry(.16,10,8),mat(0xf0a5bf));p.scale.set(.8,.45,1.5);p.position.set(Math.cos(j*Math.PI/3)*.2,.32,Math.sin(j*Math.PI/3)*.2);p.rotation.y=-j*Math.PI/3;g.add(p)}g.position.set(x,.2,z);scene.add(g);petals.push(g)}
for(let i=0;i<20;i++)makeFlower(Math.sin(i*9.3)*25,Math.cos(i*5.7)*27-4);
function toast(t){let e=document.getElementById('toast');e.textContent=t;e.style.opacity=1;clearTimeout(toast.timer);toast.timer=setTimeout(()=>e.style.opacity=0,1900)}
document.getElementById('pray').onclick=()=>{bowRemaining=1;toast('🙏 Bạn chắp tay lễ Phật. Chúc bạn bình an!')};
document.getElementById('offer').onclick=()=>{
 const bouquet=new THREE.Group();
 for(let i=0;i<5;i++){let f=new THREE.Mesh(new THREE.SphereGeometry(.16,10,8),mat([0xf2a5b8,0xf2d27b,0xffffff,0xe68bb0,0xf4c5d0][i]));f.position.set((i-2)*.18,.35+Math.abs(i-2)*.04,0);bouquet.add(f)}
 bouquet.position.set(0,.25,-1.2);player.add(bouquet);
 setTimeout(()=>player.remove(bouquet),4500);toast('💐 Bạn đã dâng hoa lên bàn lễ!');
};
document.getElementById('bow100').onclick=()=>{if(bowRemaining>0)return;bowRemaining=100;toast('🙇 Bắt đầu vái 100 lần. Bạn có thể dừng bằng cách bấm lại.')};
document.getElementById('squat').onclick=()=>{squatMode=!squatMode;toast(squatMode?'🧎 Nhân vật đang ngồi xổm.':'Nhân vật đứng lên.');};
document.getElementById('collect').onclick=()=>{let nearest=null,dist=3;for(let p of petals){let d=p.position.distanceTo(player.position);if(d<dist){dist=d;nearest=p}}if(nearest){scene.remove(nearest);petals.splice(petals.indexOf(nearest),1);flowers++;document.getElementById('flowers').textContent=flowers;toast('🪷 Bạn đã nhặt được một bông sen!')}else toast('Hãy đến gần một bông hoa sen nhé!')};
const binds={up:'ArrowUp',down:'ArrowDown',left:'ArrowLeft',right:'ArrowRight'};
for(let [id,key] of Object.entries(binds)){let el=document.getElementById(id);el.addEventListener('pointerdown',e=>{e.preventDefault();keys[key]=true;el.setPointerCapture(e.pointerId)});['pointerup','pointercancel','lostpointercapture'].forEach(ev=>el.addEventListener(ev,()=>keys[key]=false))}
addEventListener('keydown',e=>{keys[e.key.toLowerCase()]=true;keys[e.key]=true});addEventListener('keyup',e=>{keys[e.key.toLowerCase()]=false;keys[e.key]=false});
let last=performance.now(),walk=0;
function animate(now){requestAnimationFrame(animate);let dt=Math.min((now-last)/1000,.04);last=now;
let f=(keys.w||keys.W||keys.ArrowUp?1:0)-(keys.s||keys.S||keys.ArrowDown?1:0),r=(keys.d||keys.D||keys.ArrowRight?1:0)-(keys.a||keys.A||keys.ArrowLeft?1:0);
let moving=Math.hypot(f,r)>0;if(squatMode){body.scale.y=.58;body.position.y=.72;face.position.y=1.25;hair.position.y=1.42}else{body.scale.y=1;body.position.y=1.05;face.position.y=1.85;hair.position.y=2.02}
if(bowRemaining>0){bowClock+=dt*5;player.rotation.x=Math.sin(bowClock)*.28;if(bowClock>Math.PI){bowClock=0;bowRemaining--;if(bowRemaining===0){player.rotation.x=0;toast('🙏 Đã hoàn thành 100 lần vái!')}}}
